name: Verilator Lint

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
      - name: Run Verilator lint (per-file)
        run: |
          status=0
          for f in $(git ls-files '*.v' '*.sv'); do
            echo "::group::Linting $f"
            verilator --lint-only -Wall "$f" || status=1
            echo "::endgroup::"
          done
          exit $status
